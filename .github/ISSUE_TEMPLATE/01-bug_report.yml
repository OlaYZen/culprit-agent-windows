name: Bug report
description: The agent crashes, errors, or behaves incorrectly.
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        For a bug in the agent itself. If the agent runs fine but a metric looks
        wrong, use the "Incorrect or missing metric" template. If the dashboard
        is broken, file it in the main culprit repository.
  - type: checkboxes
    id: preflight
    attributes:
      label: Before you start
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
        - label: I am on the latest release / image.
          required: true
        - label: This is not a security vulnerability (those go privately through the Security tab of the main repo).
          required: true
  - type: dropdown
    id: method
    attributes:
      label: How is the agent deployed?
      options:
        - Native, agent.sh as a normal user
        - Native, agent.sh as root (sudo)
        - systemd user service
        - systemd system service (root)
        - Docker (docker run / compose)
        - TrueNAS SCALE or another managed container platform
        - Other (describe below)
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what did you expect?
      description: A clear description of the actual behaviour and the expected behaviour.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Deploy the agent with ...
        2. ...
        3. See ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / image tag
      description: Git short SHA of the bundle, or the image tag for a Docker agent.
      placeholder: e.g. ghcr.io/olayzen/culprit-agent:latest
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS and kernel of the monitored machine
      placeholder: e.g. Debian 12, kernel 6.1
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Agent logs (debug)
      description: |
        Re-run with debug logging and paste the output, secrets redacted.
        Native: add `CULPRIT_LOG_LEVEL=debug`. Docker: add
        `-e CULPRIT_LOG_LEVEL=debug`, then `docker logs culprit-agent`.
      render: shell
